[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# O publish é a raiz do repo, então a pasta das functions também vai para o CDN.
# Não há segredo no código (as chaves vêm do ambiente), mas não há motivo para servi-lo.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"

# O publish é a raiz do repositório, então tudo que está versionado iria ao ar.
# Só a landing e a anamnese são públicas; o resto é material interno e fica
# fora do CDN. Para liberar algo deliberadamente, remova a regra correspondente.

# Protótipos: contêm fotos de pacientes sem autorização para republicação.
[[redirects]]
  from = "/prototipos/*"
  to = "/index.html"
  status = 404
  force = true

# Roteiro de call: dados da cliente e estratégia comercial.
[[redirects]]
  from = "/roteiro-*"
  to = "/index.html"
  status = 404
  force = true

# Proposta e contrato: documentos comerciais, enviados individualmente.
[[redirects]]
  from = "/proposta/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/contratos/*"
  to = "/index.html"
  status = 404
  force = true
